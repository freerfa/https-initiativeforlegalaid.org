[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "initiative-legal-aid"
version = "1.0.0"
description = "Website + admin CMS for Initiative for Legal Aid (South Sudan)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Flask==3.1.3",
  "Flask-WTF==1.2.2",
  "WTForms==3.2.1",
  "filetype==1.2.0",
  "python-dotenv==1.2.1",
]
