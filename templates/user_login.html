{% extends 'base.html' %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Member access</span>
    <h2>Log in</h2>
    <p>Access your Initiative for Legal Aid account.</p>
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <label>Username or email<input type="text" name="identifier" autocomplete="username" required /></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
      <button type="submit" class="primary-btn wide">Log in</button>
    </form>
    <p class="auth-switch">Need an account? <a href="/register">Register here</a></p>
  </div>
</section>
{% endblock %}
