services:
  - type: web
    name: ila
    runtime: python
    buildCommand: pip install -r requirements.txt -r requirements-prod.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ADMIN_BOOTSTRAP
        value: 1
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
      # Contact-form email notifications (optional — see deploy/EMAIL_SETUP.md).
      # sync: false = set the real value in the Render dashboard, never in git.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
    disk:
      name: ila-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
