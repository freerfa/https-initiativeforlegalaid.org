services:
  - type: web
    name: ila
    runtime: python
    buildCommand: pip install -r requirements.txt -r requirements-prod.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ADMIN_BOOTSTRAP
        value: 1
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: ila-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
